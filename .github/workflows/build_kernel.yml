name: Build

on:
  workflow_dispatch:

jobs: 
  build_kernel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Build Kernel
        run: |
          source ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          path: |
            build/*
          compression-level: 0
          
      - name: Publish
        id: release
        uses: softprops/action-gh-release@v2.4.2
        with:
          files: build/DMXQ*.zip
          name: KERNEL_${{ github.run_number }}
          tag_name: ${{ github.run_number }}
          body: |
            **DMXQ-AOSP-KERNEL**:

            - **KERNELSU included (not next)**
            - **Run Number:** ${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          path: |
            build/*
          compression-level: 0
